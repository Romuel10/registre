name: Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK
        run: android sdk install platforms/android-37 build-tools/36.0.0

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APPLICATION_ID: ${{ secrets.FIREBASE_APPLICATION_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: registre-communautaire-debug
          path: app/build/outputs/apk/debug/app-debug.apk
